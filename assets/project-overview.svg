<svg xmlns="http://www.w3.org/2000/svg" width="780" height="344" viewBox="0 0 780 344" role="img" aria-labelledby="title desc">
  <title id="title">카메라 영상과 차량 상태가 프로젝트 코드를 통과하는 흐름</title>
  <desc id="desc">영상 인식은 YOLOv8s 가중치를 사용해 화면에 표시할 탐지 박스를 돌려주고 탐지 결과를 임무 상태 관리에 전달한다. 경로 탐색은 지형 지도에서 경유지를 구성한다. 임무 상태 관리는 탐지 결과, 경유지, 차량 상태와 관측표를 이용해 시뮬레이터에 동작을 반환한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#485973"/></marker>
    <g id="file" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M1 1H9L14 6V18H1Z M9 1V6H14 M4 10H11 M4 13H10"/>
    </g>
    <style>
      text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#1e2b41}
      .wire{stroke:#485973;fill:none;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
      .port{font-size:17px;font-weight:600}
      .module{font-size:22px;font-weight:700}
      .asset{font-size:16px;font-weight:600}
      .flow{font-size:15px;fill:#425672}
    </style>
  </defs>
  <rect width="780" height="344" rx="12" fill="#faf9f5"/>
  <rect x="135" y="13" width="494" height="318" rx="12" fill="#fff" stroke="#b4bbca"/>
  <path d="M147 13H617Q629 13 629 25V55H135V25Q135 13 147 13Z" fill="#26354c"/>
  <text x="154" y="41" style="fill:white;font-size:22px;font-weight:700">프로젝트 코드</text>
  <text x="612" y="40" text-anchor="end" style="fill:#e5ebf3;font-size:17px">Python / Flask</text>
  <g text-anchor="middle">
    <text x="67" y="35" class="port">시뮬레이터</text><text x="67" y="56" class="flow">입력</text>
    <text x="705" y="35" class="port">시뮬레이터</text><text x="705" y="56" class="flow">반영</text>
  </g>
  <g class="port">
    <text x="13" y="111">카메라 영상</text>
    <text x="13" y="209">차량 상태</text>
    <text x="655" y="111">탐지 박스 표시</text>
    <text x="655" y="209">차량 동작 반영</text>
  </g>
  <path d="M102 105H159" class="wire"/>
  <path d="M94 203H431" class="wire"/>
  <g>
    <rect x="163" y="74" width="168" height="72" rx="7" fill="#eef0ff" stroke="#bbc2e7"/>
    <path d="M165 84V136" fill="none" stroke="#5262b1" stroke-width="4" stroke-linecap="round"/>
    <text x="181" y="103" class="module">영상 인식</text>
    <use href="#file" x="181" y="116" color="#4859a2"/>
    <text x="204" y="131" class="asset" style="fill:#43539b">YOLOv8s 가중치</text>
  </g>
  <path d="M331 105H647" class="wire"/>
  <path d="M381 105V149Q381 155 387 155H513Q519 155 519 161V175" class="wire"/>
  <circle cx="381" cy="105" r="3.4" fill="#485973"/>
  <text x="432" y="146" class="flow">탐지 결과</text>
  <g>
    <rect x="163" y="245" width="168" height="71" rx="7" fill="#e8f3ee" stroke="#accdc0"/>
    <path d="M165 255V306" fill="none" stroke="#307668" stroke-width="4" stroke-linecap="round"/>
    <text x="181" y="274" class="module">경로 탐색</text>
    <use href="#file" x="181" y="285" color="#286657"/>
    <text x="204" y="301" class="asset" style="fill:#286657">지형 고도 지도</text>
  </g>
  <path d="M331 279H513Q519 279 519 273V261" class="wire"/>
  <text x="368" y="270" class="flow">경유지</text>
  <g>
    <rect x="435" y="179" width="181" height="78" rx="7" fill="#fff8e9" stroke="#dac394"/>
    <path d="M437 189V247" fill="none" stroke="#a06928" stroke-width="4" stroke-linecap="round"/>
    <text x="452" y="208" class="module">임무 상태 관리</text>
    <use href="#file" x="452" y="222" color="#88591d"/>
    <text x="475" y="237" class="asset" style="fill:#80531b">거리–포신각 관측표</text>
  </g>
  <path d="M616 203H647" class="wire"/>
</svg>
