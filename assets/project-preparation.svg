<svg xmlns="http://www.w3.org/2000/svg" width="780" height="302" viewBox="0 0 780 302" role="img" aria-labelledby="title desc">
  <title id="title">탐지 모델, 거리–포신각 관측표와 시연 맵을 준비한 과정</title>
  <desc id="desc">모델은 환경별 이미지 수집과 라벨링, 후보 학습과 비교를 거쳐 결정했다. 사격 데이터는 측정과 정제, 예측 곡선 비교를 거쳐 실측값 표를 채택했다. 이동 경로를 설계하고 팀원이 만든 맵에서 주행과 인식을 통합했다.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#1e2b41}
      .heading text{fill:#fff;font-size:19px;font-weight:650}
      .label{font-size:20px;font-weight:700}
      .step{font-size:18px;font-weight:550}
      .result{font-size:19px;font-weight:700}
      .chevron{fill:none;stroke:#68778a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="file" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M1 1H9L14 6V18H1Z M9 1V6H14 M4 10H11 M4 13H10"/>
    </g>
    <g id="next" class="chevron"><path d="M0 0H15 M11 -4L15 0 11 4"/></g>
  </defs>
  <rect width="780" height="302" rx="12" fill="#faf9f5"/>
  <rect x="13" y="13" width="754" height="276" rx="10" fill="#fff" stroke="#b4bbca"/>
  <path d="M23 13H757Q767 13 767 23V60H13V23Q13 13 23 13Z" fill="#26354c"/>
  <g class="heading">
    <text x="31" y="44">구성 요소</text><text x="177" y="44">수집·설계</text>
    <text x="375" y="44">비교·구현</text><text x="560" y="44">최종 결과물</text>
  </g>
  <path d="M31 137H748 M31 213H748" stroke="#d7dce2"/>
  <g>
    <path d="M31 84V113" stroke="#5262b1" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="43" y="106">탐지 모델</text>
    <text class="step" x="177" y="105">이미지 수집·라벨링</text>
    <use href="#next" x="341" y="98"/>
    <text class="step" x="375" y="105">후보 학습·비교</text>
    <use href="#next" x="521" y="98"/>
    <rect x="549" y="76" width="200" height="45" rx="7" fill="#eef0ff" stroke="#bbc2e7"/>
    <use href="#file" x="561" y="88" color="#4859a2"/>
    <text class="result" x="586" y="105" style="fill:#43539b">YOLOv8s 가중치</text>
  </g>
  <g>
    <path d="M31 160V189" stroke="#a06928" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="43" y="182">사격 데이터</text>
    <text class="step" x="177" y="181">관측값 수집·정제</text>
    <use href="#next" x="341" y="174"/>
    <text class="step" x="375" y="181">예측 곡선 비교</text>
    <use href="#next" x="521" y="174"/>
    <rect x="549" y="152" width="200" height="45" rx="7" fill="#fff8e9" stroke="#dac394"/>
    <use href="#file" x="561" y="164" color="#88591d"/>
    <text class="result" x="586" y="181" style="fill:#80531b">거리–포신각 관측표</text>
  </g>
  <g>
    <path d="M31 236V265" stroke="#307668" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="43" y="258">시연 맵</text>
    <text class="step" x="177" y="257">이동 경로 설계</text>
    <use href="#next" x="341" y="250"/>
    <text class="step" x="375" y="257">맵 제작·주행 통합</text>
    <use href="#next" x="521" y="250"/>
    <rect x="549" y="228" width="200" height="45" rx="7" fill="#e8f3ee" stroke="#accdc0"/>
    <use href="#file" x="561" y="240" color="#286657"/>
    <text class="result" x="586" y="257" style="fill:#286657">시연 맵과 이동 경로</text>
  </g>
</svg>
